[package]
name = "adhkar-al-muslim"
version = "1.9.14"
description = "أذكار المسلم - الورد اليومي"
authors = ["Adhkar Muslim Apps"]
edition = "2021"
rust-version = "1.77.2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true